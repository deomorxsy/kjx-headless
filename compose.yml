#version: "3.8"
#
volumes:
  prometheus_data: {}
  grafana_data: {}
  qemu_kjx: {}

services:
  # zig-wasm-typescript-deno-bpf
  zwtd_bpf:
    environment:
      - git_hash
    build:
      context: "./trace/wasm/"
      dockerfile: "./Dockerfile"
      tags:
        - "localhost:5000/wasm_bpf:latest"
    entrypoint: ["run", "--allow-net", "/app/main.ts"]
    # command: |
    #   echo hmm
  libbpf_core:
    environment:
      - git_hash
    build:
      context: "./trace/libbpf-core/"
      dockerfile: "./Dockerfile"
      tags:
        - "localhost:5000/libbpf-core:latest"
    entrypoint: ["/bin/sh", "-c"]
    command: |
      apk upgrade && apk update &&
      apk add clang libelf elfutils-dev zlib-dev bpftool \
        git make &&
      setcap cap_sys_admin,cap_dac_override+eip $(readlink -f $(which qemu-img)) &&
      setcap cap_sys_admin+eip $(readlink -f $(which parted)) &&
      setcap cap_sys_admin,cap_dac_override,cap_dac_read_search+eip $(readlink -f $(which kpartx)) && \
      setcap cap_sys_admin+eip $(readlink -f $(which mkfs.ext4)) && \
      setcap cap_sys_admin,cap_dac_override+ep $(readlink -f $(which losetup))
      . /app/scripts/squashed.sh
    stop_signal: SIGINT
  # tryout
  libbpf_final:
    environment:
      - git_hash
    build:
      # keep context for the root repository to provide Makefile dependencies
      context: "."
      dockerfile: "./trace/libbpf-core/final/Dockerfile"
      tags:
        - "localhost:5000/final:latest"
    # entrypoint: ["/bin/sh", "-c"]
    # command: |
    stop_signal: SIGINT
  ayaya:
    environment:
      - git_hash=${git_hash:-default_git_hash}
      - RUSTUP_HOME=${RUSTUP_HOME:-/home/aya/rustup}
      - CARGO_HOME=${CARGO_HOME:-/home/aya/cargo}
      - PATH=${PATH:-/usr/local/cargo/bin:/home/aya/cargo/bin:$PATH}
      - RUST_VERSION=${RUST_VERSION:-1.90.0}
      - APPLICATION_USER=${APPLICATION_USER:-aya}
      - APPLICATION_UID=${APPLICATION_UID:-1000}
    build:
      context: . # "./trace/ayaya"
      dockerfile: "./trace/ayaya/Dockerfile" # "./Dockerfile"
      tags:
        - "localhost:5000/aya_rs:latest"
    entrypoint: ["/bin/sh", "-c"]
    command: |
      echo "aya-rs container"
      printf "\n|> List of environment variables:\n\n"
      env
    stop_signal: SIGINT

  isogen_new:
    build:
      context: "."
      dockerfile: "./Dockerfile"
      #"./Dockerfile"
      tags:
        - "localhost:5000/isogen_new:latest"
    entrypoint: ["/bin/sh", "-c"]
    command: |
      apk upgrade && apk update &&
      apk add libcap parted device-mapper fuse-overlayfs qemu qemu-img qemu-system-x86_64 \
        file multipath-tools e2fsprogs xorriso expect libseccomp &&
      setcap cap_sys_admin,cap_dac_override+eip $(readlink -f $(which qemu-img)) && \
      setcap cap_sys_admin+eip $(readlink -f $(which parted)) && \
      setcap cap_sys_admin,cap_dac_override,cap_dac_read_search+eip $(readlink -f $(which kpartx)) && \
      setcap cap_sys_admin+eip $(readlink -f $(which mkfs.ext4)) && \
      setcap cap_sys_admin,cap_dac_override+ep $(readlink -f $(which losetup)) && \
      . /app/scripts/squashed.sh
    devices:
      # HOST_PATH:CONTAINER_PATH[:CGROUP_PERMISSIONS]
      - /dev/mapper/control:/dev/mapper/control
      - /dev/loop-control:/dev/loop-control
      - /dev/fuse:/dev/fuse
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - CHOWN
      - SETFCAP
      - MKNOD
    stop_signal: SIGINT
  iso_system_test:
    build:
      context: "."
      dockerfile: "./tests/Dockerfile"
      tags:
        - "localhost:5000/iso-system-test:01"
    stop_signal: SIGINT
  mock_ist:
    build:
      context: "."
      dockerfile: "./tests/Dockerfile"
      tags:
        - "localhost:5000/mock_ist:latest"
    cap_add:
      - SYS_ADMIN
      - DAC_OVERRIDE
    stop_signal: SIGINT
  initramfs:
    environment:
      - git_hash
    build:
      context: "."
      dockerfile: "./deploy/isogen/busybox/Dockerfile"
      args:
        GIT_COMPOSE_SHA: "${GIT_COMMIT_HASH:-none}"
      tags:
        - "localhost:5000/initramfs:latest"
    stop_signal: SIGINT
  rootfs:
    container_name: rootfs
    environment:
      - git_hash
    build:
      context: "."
      dockerfile: "./deploy/isogen/rootfs/Dockerfile"
      args:
        GIT_COMPOSE_SHA: "${GIT_COMMIT_HASH:-none}"
      tags:
        - "localhost:5000/rootfs:latest"
    stop_signal: SIGINT
  grub:
    environment:
      - git_hash
    build:
      context: "."
      dockerfile: "./deploy/isogen/grub/Dockerfile"
      args:
        GIT_COMPOSE_SHA: "${GIT_COMMIT_HASH:-none}"
      tags:
        - "localhost:5000/eltorito:latest"
    stop_signal: SIGINT
  kernel:
    build:
      context: "./deploy/isogen/kernel/"
      tags:
        - "localhost:5000/linux_build:latest"
    stop_signal: SIGINT
  libbpfgo:
    build:
      context: "./trace/libbpfgo"
      # Dockerfile's location is relative to the context field (the base directory).
      dockerfile: "./Dockerfile"
      tags:
        - "localhost:5000/libbpfgo:latest"
    stop_signal: SIGINT
  exporter: # ebpf-exporter
    build:
      context: "./assets/ebpf_exporter/"
      # Dockerfile's location is relative to the context field (the base directory).
      dockerfile: "../../trace/exporter-libbpfgo/Dockerfile"
      tags:
        - "localhost:5000/exporter-static:latest"
    stop_signal: SIGINT
  # honey-potion
  hpota:
    container_name: hpota
    build:
      context: "."
      # Dockerfile's location is relative to the context field (the base directory).
      dockerfile: "./trace/hpota/Dockerfile"
      tags:
        - "localhost:5000/hpota:latest"
    stop_signal: SIGINT

  # =======================
  # AWS provider emulation
  # =======================
  tofu_deps:
    build:
      context: "."
      dockerfile: "./deploy/Dockerfile.lstf"
      tags:
        - "localhost:5000/tofu_deps:latest"
  localstack:
    build:
      tags:
        - "localhost:5000/localstack:latest"
    depends_on:
      - tofu_deps
    container_name: "${LOCALSTACK_DOCKER_NAME:-localstack-main}"
    image: localstack/localstack
    ports:
      - "127.0.0.1:4566:4566" # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559" # external services port range
    environment:
      #- DEBUG=${DEBUG:-0}
      - DEBUG=$${1:-0}
      - SERVICES=ec2,s3,vpc
      - DATA_DIR=/tmp/localstack/data
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

  # ====================
  # runit supervised scripts
  # ====================
  bwc:
    container_name: bwc
    environment:
      - git_hash
    build:
      context: "."
      dockerfile: "./scripts/libkjx/Dockerfile.bwc"
      tags:
        - "localhost:5000/bwc:latest"
    entrypoint: ["/bin/sh", "-c"]
    command: |
      apk upgrade && apk update &&
      apk add git musl-gcc openssl-dev \
        libcrypto zlib elfutils-dev && \
      MODE="builder" PROGRAM="bwc" . ./scripts/entrypoints/static_beetor.sh
    stop_signal: SIGINT
  beetor:
    container_name: beetor
    environment:
      - git_hash
    build:
      context: "."
      dockerfile: "./scripts/libkjx/Dockerfile.beetor"
      tags:
        - "localhost:5000/beetor:latest"
    entrypoint: ["/bin/sh", "-c"]
    command: |
      apk upgrade && apk update &&
      apk add git musl-gcc openssl-dev \
        libcrypto zlib elfutils-dev && \
        MODE="builder" PROGRAM="beetor" . ./scripts/entrypoints/static_beetor.sh
    stop_signal: SIGINT

  # ========================
  # libguestfs library with ocaml
  # =========================
  librakuda:
    environment:
      - git_hash
    build:
      context: "./scripts/librakuda/"
      dockerfile: "./Dockerfile"
      tags:
        - "localhost:5000/librakuda:latest"
    entrypoint: ["/bin/sh", "-c"]
    command: |
      apk upgrade && apk update && \
      apk add dune ocaml musl-dev && \
      cat /tests/test_result_*_.txt
    stop_signal: SIGINT
  rakupasa:
    environment:
      - git_hash
    build:
      context: "./scripts/librakuda/parser_example/Dockerfile"
      tags:
        - "localhost:5000/rakupasa:latest"
    entrypoint: ["/bin/sh", "-c"]
    command: |
      apk upgrade && apk update && \
      apk add dune ocaml musl-dev && \
      eval $(opam env --switch=utop)
  #
  # ========================
  # android cross-compilation
  # build with xmake
  # =========================
  android:
    environment:
      - git_hash
    build:
      context: "."
      dockerfile: "./trace/android/Dockerfile"
      tags:
        - "localhost:5000/android:latest"
    entrypoint: ["/bin/sh", "-c"]
    command: |
      echo hmm
    stop_signal: SIGINT
  final_core:
    environment:
      - git_hash
    build:
      context: "."
