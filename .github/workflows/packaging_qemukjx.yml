name: qemu-kjx

# This rule triggers when the workflow will run
on:
  push:
    branches:
      - "isogen/iso9660"
  pull_request:
    branches:
      - "main"
      - "releases/**"
  schedule:
    - cron: "11 12 * * 1,3,6"
  # run the workflow manually from Actions tab
  workflow_dispatch:

# jobs can run in sequence or parallel in a workflow
jobs:
  # This single job is called "build"
  build:
    # Specify the operating system for the runner job
    runs-on: ubuntu-latest
    env:
      git_hash: $(git rev-parse --short "$GITHUB_SHA")

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # the job gets runned into $GITHUB_WORKSPACE, that is the environment variable for the repo
      - name: Access current repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Build docker image
        run: |
          #docker run -d -p 5000:5000 --name registry registry:3.0
          # env git_hash env goes into the compose.yml
          # docker compose -f ./compose.yml --progress=plain build --no-cache qemu_kjx
          make qonq_qemukjx
          #docker push localhost:5000/qemu-kjx:latest

      - name: Retrieve artifact from docker image
        run: |
          docker run -it --name qemu-kjx -d localhost:5000/qonq_qemukjx:latest
          mkdir -p ./artifacts/qemu-builder/
          docker cp qemu-kjx:/qemukjx-tarball-pkg.tar.gz ./artifacts/packaging
          ls -allhtr ./artifacts/packaging/

      - name: Archive the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptables-tarball
          path: ${{ github.workspace }}/artifacts/packaging/qemukjx-tarball-pkg.tar.gz
      # - name: Archive the build artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: qemu-kjx
      #     path: ${{ github.workspace }}/artifacts/qemu-builder/qemu-kjx.img
