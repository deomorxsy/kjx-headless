name: qonq_qemukjx

# This rule triggers when the workflow will run
on:
  push:
    branches:
      - "isogen/iso9660"
  pull_request:
    branches:
      - "main"
      - "releases/**"
  schedule:
    - cron: "11 12 * * 1,3,6"
  # run the workflow manually from Actions tab
  workflow_dispatch:

# jobs can run in sequence or parallel in a workflow
jobs:
  # This single job is called "build"
  build:
    # Specify the operating system for the runner job
    runs-on: ubuntu-latest
    env:
      git_hash: $(git rev-parse --short "$GITHUB_SHA")

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # the job gets runned into $GITHUB_WORKSPACE, that is the environment variable for the repo
      - name: Access current repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Build docker image
        run: |
          make qonq_qemukjx

      - name: Retrieve artifact from OCI image
        run: |
          docker compose -f ./compose.yml create qonq_qemukjx
          mkdir -p "${{ github.workspace }}"/artifacts/packaging/
          docker cp qonq_qemukjx:/app/qemukjx-tarball-pkg.tar.gz ./artifacts/packaging
          ls -allhtr ./artifacts/packaging/

      - name: Archive the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemukjx-tarball
          path: ${{ github.workspace }}/artifacts/packaging/qemukjx-tarball-pkg.tar.gz
