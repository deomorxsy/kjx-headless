name: kata
#
on:
  push:
    branches:
      - "microvms/aio"
  pull_request:
    branches:
      - "main"
      - "releases/**"
  schedule:
    - cron: "11 12 * * 1,3,6"
  # run the workflow manually from Actions tab
  workflow_dispatch:
  # run the workflow when called from another workflow
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Build and Retrieve OCI image
        run: |
          make qonq_kata

