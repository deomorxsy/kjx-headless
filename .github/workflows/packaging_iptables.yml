name: qonq-qdb_iptables

# This rule triggers when the workflow will run
on:
  push:
    branches:
      - "packaging/usergroups"
  pull_request:
    branches:
      - "main"
      - "releases/**"
  schedule:
    - cron: "11 12 * * 1,3,6"
  # run the workflow manually from Actions tab
  workflow_dispatch:
  # run the workflow when called from another workflow
  workflow_call:

# jobs can run in sequence or parallel in a workflow
jobs:
  # This single job is called "build"
  build:
    # Specify the operating system for the runner job
    runs-on: ubuntu-latest
    env:
      git_hash: $(git rev-parse --short "$GITHUB_SHA")

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # the job gets runned into $GITHUB_WORKSPACE, that is the environment variable for the repo
      - name: Access current repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Build OCI image
        run: |
          docker run -d -p 5000:5000 --name registry registry:latest
          docker compose -f ./compose.yml --progress=plain build --no-cache qonq-iptables
          docker push localhost:5000/qonq_iptables:latest

      - name: Retrieve artifact from docker image
        run: |
          # docker create qonq-iptables -d localhost:5000/qonq-iptables:latest
          docker compose -f ./compose.yml create qonq-iptables
          mkdir -p "${{ github.workspace }}"/artifacts/packaging/
          docker cp qonq-iptables:/iptables-so-pkg.tar.gz "${{ github.workspace }}"/artifacts/packaging/
          docker cp qonq-iptables:/iptables-bin-pkg.tar.gz "${{ github.workspace }}"/artifacts/packaging/

      - name: Archive the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qonq-iptables_shared-objects
          path: ${{ github.workspace }}/artifacts/packaging/iptables-so-pkg.tar.gz

      - name: Archive the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qonq-iptables_bin
          path: ${{ github.workspace }}/artifacts/packaging/iptables-bin-pkg.tar.gz

