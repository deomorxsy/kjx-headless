name: qonq_iptables

# This rule triggers when the workflow will run
on:
  push:
    branches:
      - "packaging/usergroups"
  pull_request:
    branches:
      - "main"
      - "releases/**"
  schedule:
    - cron: "11 12 * * 1,3,6"
  # run the workflow manually from Actions tab
  workflow_dispatch:
  # run the workflow when called from another workflow
  workflow_call:

# jobs can run in sequence or parallel in a workflow
jobs:
  # This single job is called "build"
  build:
    # Specify the operating system for the runner job
    runs-on: ubuntu-latest
    env:
      git_hash: $(git rev-parse --short "$GITHUB_SHA")

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # the job gets runned into $GITHUB_WORKSPACE, that is the environment variable for the repo
      - name: Access current repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Build OCI image
        run: |
          make qonq_iptables
          # docker run -d -p 5000:5000 --name registry registry:latest
          # docker compose -f ./compose.yml --progress=plain build --no-cache qonq_iptables
          # docker push localhost:5000/qonq_iptables:latest

      #- name: Retrieve artifact from OCI image
      #  run: |
      #    # docker create qonq_iptables -d localhost:5000/qonq_iptables:latest
      #    docker compose -f ./compose.yml create qonq_iptables
      #    mkdir -p "${{ github.workspace }}"/artifacts/packaging/
      #    docker cp qonq_iptables:/app/iptables-so-pkg.tar.gz "${{ github.workspace }}"/artifacts/packaging/
      #    docker cp qonq_iptables:/app/iptables-bin-pkg.tar.gz "${{ github.workspace }}"/artifacts/packaging/
      - name: Archive the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptables-tarball
          path: ${{ github.workspace }}/artifacts/packaging/iptables-tarball-pkg.tar.gz

